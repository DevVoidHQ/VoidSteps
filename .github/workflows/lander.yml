name: Lander

# Independent of the app: the lander is a marketing site with its own clock.
on:
  push:
    branches: [main]
    paths: ["lander/**", ".github/workflows/lander.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lander

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: lander/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
