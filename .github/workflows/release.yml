name: Release

# Desktop builds ride version tags, never a branch push. The lander deploys on
# its own schedule (lander.yml) so a marketing copy fix can't ship a binary.
#
# workflow_dispatch builds but does not publish: it exists to prove the pipeline
# still works without burning a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Nothing gets built until the tag is honest and the tests are green. A
  # release is the one artifact nobody re-runs, so the gate belongs here rather
  # than only on pull requests.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose. package.json's packageManager field is
      # the single source of truth, and action-setup errors out if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Three files carry the version and the bundler reads tauri.conf.json,
      # not the tag. Without this check, tagging v0.2.0 ships a dmg named
      # 0.1.0 and the release page lies about its own contents.
      - name: Version agrees with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./desktop/tauri.conf.json').version")
          crate=$(grep -m1 '^version = ' desktop/Cargo.toml | cut -d'"' -f2)
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag tauri.conf.json=$conf Cargo.toml=$crate package.json=$pkg"
          mismatch=0
          for pair in "tauri.conf.json:$conf" "Cargo.toml:$crate" "package.json:$pkg"; do
            if [ "${pair#*:}" != "$tag" ]; then
              echo "::error::${pair%%:*} is ${pair#*:}, but the tag says $tag"
              mismatch=1
            fi
          done
          exit $mismatch

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

  # macOS only for now. The Windows build has never been tested on Windows, and
  # an untested binary on a release page is worse than no binary: it is unsigned,
  # so SmartScreen already warns about it, and a first-run failure lands on a
  # user who has no way to tell a packaging bug from a broken app.
  #
  # To add Windows back: restore the windows-latest entry below, restore "nsis"
  # to bundle.targets in desktop/tauri.conf.json, restore the nsis glob in the
  # Upload bundles step, and update the Install section of README.md. Prove it
  # with workflow_dispatch before tagging.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal so one dmg covers Apple Silicon and Intel.
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose. package.json's packageManager field is
      # the single source of truth, and action-setup errors out if both are set.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target

      - run: pnpm install --frozen-lockfile

      # APPLE_API_KEY is the key ID, not the key material, and the bundler wants
      # a real .p8 on disk (tauri-bundler src/bundle/macos/sign.rs). So the
      # secret carries base64 of the file and we write it out here.
      - name: Write the App Store Connect key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPLE_API_KEY_BASE64" ]; then
            echo "::warning::No App Store Connect key. This build will not be notarized."
            exit 0
          fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          chmod 600 "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate, exported as a .p12 that
          # includes the private key. Without the key the build looks green and
          # signs nothing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Notarization. APPLE_API_KEY_PATH is set by the step above.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Updater signature. Separate from Apple signing entirely: the
          # updater refuses any payload this key did not sign, and a build
          # without it produces no .sig, so latest.json points at something no
          # installed app will accept.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The Rust crate lives in desktop/, not the conventional src-tauri/.
          # Without this the CLI falls back to walking the tree for a
          # tauri.conf.json, which is order dependent. Name it instead.
          TAURI_APP_PATH: desktop
        with:
          projectPath: .
          # Empty on workflow_dispatch, which stops tauri-action creating a
          # release named after the branch.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('VoidSteps {0}', github.ref_name) || '' }}
          # Published, not draft. A draft release's assets are not publicly
          # reachable, so latest.json 404s and no installed app ever hears
          # about the release. The verify job above is the gate that makes
          # publishing straight away safe.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri notarizes the .app but never the .dmg: tauri-bundler's
      # bundle/macos/dmg.rs has no notarize call, only app.rs does. Gatekeeper
      # rejects an unnotarized dmg before the user ever reaches the app inside,
      # so without this step a green build still ships an unopenable download.
      - name: Notarize and staple the dmg
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg=$(find desktop/target -path "*/bundle/dmg/*.dmg" | head -1)
          if [ -z "$dmg" ]; then
            echo "::error::no dmg found to notarize"
            exit 1
          fi
          echo "notarizing $dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          # Prove it rather than trusting the exit codes above.
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"

      # tauri-action uploaded the dmg before it was stapled, so the asset on the
      # release is the unopenable one until it is replaced.
      - name: Replace the release asset with the stapled dmg
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.DMG_PATH != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$DMG_PATH" --clobber

      # A dispatch build publishes nothing, so keep the bundles reachable.
      - name: Upload bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: voidsteps-${{ matrix.platform }}
          path: |
            desktop/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
