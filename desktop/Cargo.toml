[package]
name = "voidsteps"
version = "0.1.0"
description = "Local-first tracker for paths, steps and routines"
authors = ["Aneesh Bhat"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collides on Windows. See rust-lang/cargo#8519.
name = "voidsteps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Opens the feedback mailto and any external link in the system handler
# rather than navigating the app's own webview to it.
tauri-plugin-opener = "2"
# Remembers window size and position between launches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
